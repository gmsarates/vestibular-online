<!-- ================================ TELA: CADASTRO ================================ -->
<div id="screen-register" class="screen hidden">
    <div class="auth-wrapper">
        <div class="auth-card card">
            <div class="card-header text-center">
                <div class="brand-icon">✨</div>
                <h1 class="card-title" id="register-title">Criar Cadastro</h1>
                <p class="card-description" id="register-subtitle">Preencha seus dados para se cadastrar</p>
            </div>
            <div class="card-content">
                <!-- Step 1: Dados -->
                <div id="register-step1">
                    <div class="form-group">
                        <label class="form-label" for="reg-name">Nome completo</label>
                        <input class="form-input" id="reg-name" placeholder="Seu nome completo" maxlength="255" autocomplete="name" />
                    </div>
                    <div class="form-group">
                        <label class="form-label" for="reg-cpf">CPF</label>
                        <input class="form-input" id="reg-cpf" placeholder="000.000.000-00" maxlength="14" autocomplete="off" />
                    </div>
                    <div class="form-group">
                        <label class="form-label" for="reg-email">Email</label>
                        <input class="form-input" id="reg-email" type="email" placeholder="seu@email.com" maxlength="255" autocomplete="email" />
                    </div>
                    <div class="form-group">
                        <label class="form-label" for="reg-phone">Telefone</label>
                        <input class="form-input" id="reg-phone" placeholder="(00) 00000-0000" maxlength="16" autocomplete="tel" />
                    </div>
                    <button class="btn btn-primary btn-full" id="btn-register">Cadastrar</button>
                    <button class="btn btn-ghost btn-full mt-xs" id="btn-back-login-from-register">Voltar para login</button>
                </div>

                <!-- Step 2: OTP -->
                <div id="register-step2" class="hidden">
                    <div class="form-group">
                        <label class="form-label" for="reg-otp">Código de verificação</label>
                        <input class="form-input otp-input" id="reg-otp" placeholder="000000" maxlength="6" autocomplete="one-time-code" />
                    </div>
                    <button class="btn btn-primary btn-full" id="btn-verify-otp">Verificar e entrar</button>
                    <button class="btn-link" id="btn-resend-reg-otp">Reenviar código</button>
                    <button class="btn btn-ghost btn-full mt-xs" id="btn-back-login-from-otp">Voltar para login</button>
                </div>
            </div>
        </div>
    </div>
</div>
