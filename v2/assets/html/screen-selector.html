<!-- ================================ TELA: SELEÇÃO DE PROVA ================================ -->
<div id="screen-selector" class="screen hidden">
    <div class="selector-wrapper">
        <div class="selector-header">
            <div>
                <h1 class="greeting" id="greeting-name">Olá, bem-vindo!</h1>
            </div>
            <button class="btn btn-ghost" id="btn-logout">Sair</button>
        </div>
        <p class="selector-hint">Verifique abaixo os vestibulares disponíveis para seu perfil.</p>

        <div id="exams-list" class="exams-list">
            <!-- Exams cards inserted by JS -->
            <div class="loading-spinner-wrap">
                <div class="spinner"></div>
            </div>
        </div>

        <div id="start-exam-bar" class="start-bar hidden">
            <button class="btn btn-primary btn-lg" id="btn-start-exam">Iniciar Prova</button>
        </div>
    </div>
</div>
