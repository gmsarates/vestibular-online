<!-- ================================ TELA: RESULTADO ================================ -->
<div id="screen-result" class="screen hidden">
    <div class="auth-wrapper">
        <div class="result-card card">
            <div class="card-header text-center">
                <h1 class="card-title">Resultado da Redação</h1>
                <p class="card-description" id="result-exam-info"></p>
            </div>
            <div class="card-content result-content">
                <!-- Status -->
                <div class="result-section text-center">
                    <p class="result-label">Status</p>
                    <p class="result-status" id="result-status-text"></p>
                </div>

                <!-- Exam status -->
                <div class="result-box">
                    <p class="result-label">Status da prova</p>
                    <p class="result-value" id="result-exam-status"></p>
                </div>

                <!-- Grade -->
                <div class="result-section text-center" id="result-grade-wrap">
                    <p class="result-label">Nota</p>
                    <p class="result-grade" id="result-grade"></p>
                </div>

                <!-- Feedback -->
                <div class="result-feedback-box" id="result-feedback-wrap">
                    <p class="result-label mb-xs">Feedback</p>
                    <p class="result-feedback" id="result-feedback"></p>
                </div>

                <div class="result-actions">
                    <button class="btn btn-outline" id="btn-result-back">Voltar</button>
                    <button class="btn btn-ghost" id="btn-result-logout">Sair</button>
                </div>
            </div>
        </div>
    </div>
</div>
